name: Verify GKI compatibility

on:
  push:
    branches: [master, susfs]
    paths:
      - '.github/workflows/verify-gki-compat.yml'
      - 'userspace/ksud/**'
      - 'userspace/ksuinit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-gki-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ksud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KowSU
        uses: actions/checkout@v4

      - name: Configure Rust Android target
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustup target add aarch64-linux-android

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify SUSFS adapter wiring
        run: |
          grep -Fq 'mod susfs;' userspace/ksud/src/main.rs
          grep -Fq 'Commands::Susfs' userspace/ksud/src/cli.rs
          grep -Fq 'susfs version' manager/app/src/main/java/me/weishu/kernelsu/ui/util/KsuCli.kt

      - name: Check SUSFS adapter for Android
        run: |
          adapter_dir=$(mktemp -d)
          mkdir -p "$adapter_dir/src"
          cp userspace/ksud/src/susfs.rs "$adapter_dir/src/lib.rs"
          {
            echo '[package]'
            echo 'name = "kowsu-susfs-adapter-check"'
            echo 'version = "0.1.0"'
            echo 'edition = "2024"'
            echo
            echo '[dependencies]'
            echo 'libc = "0.2"'
          } > "$adapter_dir/Cargo.toml"
          cargo check --manifest-path "$adapter_dir/Cargo.toml" --target aarch64-linux-android

      - name: Check complete KowSU daemon
        run: cargo check --locked --package ksud --target aarch64-linux-android
