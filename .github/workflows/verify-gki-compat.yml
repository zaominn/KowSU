name: Verify GKI compatibility

on:
  push:
    branches: [master, susfs]
    paths:
      - '.github/workflows/verify-gki-compat.yml'
      - 'userspace/ksud/**'
      - 'userspace/ksuinit/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-gki-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ksud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KowSU
        uses: actions/checkout@v4

      - name: Configure Rust Android target
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustup target add aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify SUSFS adapter wiring
        run: |
          grep -Fq 'mod android;' userspace/ksud/src/main.rs
          grep -Fq 'Commands::Susfs' userspace/ksud/src/cli.rs
          grep -Fq 'susfs version' manager/app/src/main/java/me/weishu/kernelsu/ui/util/KsuCli.kt
          grep -Fq 'SUSFS_CONFIG' userspace/ksud/src/defs.rs
          grep -Fq 'on_post_fs_data' userspace/ksud/src/init_event.rs

      - name: Check complete KowSU daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo check --locked --package ksud --target aarch64-linux-android
